<div class="d-flex justify-content-between">
    <div>
        <h5>Data From Service</h5>
        <p>Total emp :: {{ employeeList.length }}</p>

        @if(employeeList.length > 0 ){
            <ul>
                @for(employee of employeeList; track employee.id) {
                <li>{{employee.id}} | {{employee.name}} | {{employee.mobile}}
                    <button (click)="updateEmployee(employee)">Edit</button>
                    <button (click)="deleteEmployee(employee.id)">Delete</button>
                </li>
            }
            </ul>
        }
    </div>

    <div>
        <h4 class="d-flex justify-content-center">Employee Form</h4>
        <form #registrationForm="ngForm" (ngSubmit)="onSubmit(registrationForm)">
            <div class="mb-2">
                <label>Id</label>
                <input type="text" name="id" [(ngModel)]="user.id" required autocomplete="off">
            </div>
            <div class="mb-2">
                <label>Name</label>
                <input type="text" name="name" [(ngModel)]="user.name" required autocomplete="off">
            </div>
            <div class="mb-2">
                <label>Mobile</label>
                <input type="number" name="mobile" [(ngModel)]="user.mobile" required autocomplete="off">
            </div>
            <div class="mb-2">
                <label>Email</label>
                <input type="email" name="email" [(ngModel)]="user.email" required autocomplete="off">
            </div>
            <div class="mb-2">
                <label>Password</label>
                <input type="password" name="password" [(ngModel)]="user.password" required>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="mt-2" [disabled]="registrationForm.invalid">
                    Submit</button>
                <button type="reset" (click)="reset()" [class.active]="isReset">Reset Form</button>
            </div>
        </form>
    </div>
</div>
