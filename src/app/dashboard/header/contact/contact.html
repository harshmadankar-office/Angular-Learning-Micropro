<h4 class="d-flex justify-content-center">Registration Form</h4>

<div class="d-flex justify-content-center">
    <!-- <form #registrationForm="ngForm" (ngSubmit)="onSubmit(registrationForm)"> -->
    <form #registrationForm="ngForm">
        <div class="mb-2">
            <label>Name</label>
            <input type="text" name="name" [(ngModel)]="user.name" required>
        </div>
        <div class="mb-2">
            <label>Mobile</label>
            <input type="number" name="mobile" [(ngModel)]="user.mobile" required>
        </div>
        <div class="mb-2">
            <label>Email</label>
            <input type="email" name="email" [(ngModel)]="user.email" required>
        </div>
        <div class="mb-2">
            <label>Password</label>
            <input type="password" name="password" [(ngModel)]="user.password" required>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="mt-2" (click)="onSubmit(registrationForm)" [disabled]="registrationForm.invalid">
                Submit</button>
            <button type="reset" (click)="reset()" [class.active]="isReset">Reset Form</button>
        </div>
    </form>
</div>
