<div class="modal-overlay">
    <div class="modal-box">

        <div class="modal-header">
            <h2>{{title | titlecase}}</h2>
            <button type="button" (click)="closeModal()">
                X
            </button>
        </div>

        <div class="modal-body">
            <ng-container #modalContent></ng-container>
        </div>
    </div>
</div>
